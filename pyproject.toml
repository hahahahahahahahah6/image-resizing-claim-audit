[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-resizing-claim-audit"
version = "0.1.0"
description = "Offline deterministic documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-resizing-claim-audit = "image_resizing_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_resizing_claim_audit*"]
